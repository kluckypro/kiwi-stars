<style>
/* Layout: translucent header → editorial branch hero with a live "сейчас" card → control rail → week as eight day tiles (7 дней + сводка); timeline grid and month as alternates. */
:root{
  --bg:#FAFBF7;--surface:#FFFFFF;--milk:#F3F6EE;--mist:#E9F0E2;--green:#6D9360;--deep:#294A35;--ink:#26332A;
  --muted:#66756A;--faint:#98A49B;--line:#E1E8DA;--line-soft:#EDF2E8;--hover:#F1F5EC;
  --warn:#946213;--warn-bg:#FBF2DF;--danger:#A9433A;--danger-bg:#F8E8E5;--ok-bg:#E7F0E0;--now:#C2593C;
  --hatch:rgba(38,51,42,.07);--scrim:rgba(22,34,26,.42);
  --sh-1:0 1px 2px rgba(38,51,42,.04),0 1px 1px rgba(38,51,42,.03);
  --sh-2:0 1px 2px rgba(38,51,42,.04),0 12px 32px -14px rgba(38,51,42,.16);
  --sh-3:0 30px 70px -24px rgba(25,45,32,.38);
  --glow:rgba(109,147,96,.16);
  --f-display:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;--r-sm:11px;--ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111713;--surface:#18201A;--milk:#1D2620;--mist:#223024;--green:#8FB581;--deep:#CFE4C2;--ink:#E5ECE2;
  --muted:#A3B0A5;--faint:#738176;--line:#2A352C;--line-soft:#212B23;--hover:#212B23;
  --warn:#E5B866;--warn-bg:#342A16;--danger:#E8907F;--danger-bg:#3A2320;--ok-bg:#20301F;--now:#E88E6E;
  --hatch:rgba(255,255,255,.05);--scrim:rgba(0,0,0,.6);
  --sh-1:0 1px 2px rgba(0,0,0,.3);--sh-2:0 1px 2px rgba(0,0,0,.3),0 14px 34px -16px rgba(0,0,0,.6);--sh-3:0 30px 70px -24px rgba(0,0,0,.8);
  --glow:rgba(143,181,129,.10);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111713;--surface:#18201A;--milk:#1D2620;--mist:#223024;--green:#8FB581;--deep:#CFE4C2;--ink:#E5ECE2;
  --muted:#A3B0A5;--faint:#738176;--line:#2A352C;--line-soft:#212B23;--hover:#212B23;
  --warn:#E5B866;--warn-bg:#342A16;--danger:#E8907F;--danger-bg:#3A2320;--ok-bg:#20301F;--now:#E88E6E;
  --hatch:rgba(255,255,255,.05);--scrim:rgba(0,0,0,.6);
  --sh-1:0 1px 2px rgba(0,0,0,.3);--sh-2:0 1px 2px rgba(0,0,0,.3),0 14px 34px -16px rgba(0,0,0,.6);--sh-3:0 30px 70px -24px rgba(0,0,0,.8);
  --glow:rgba(143,181,129,.10);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(900px 420px at 8% -120px,var(--glow),transparent 70%),radial-gradient(700px 360px at 100% 0,var(--glow),transparent 70%);background-repeat:no-repeat}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.tnum{font-variant-numeric:tabular-nums}
.serif{font-family:var(--f-display)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);padding-top:env(safe-area-inset-top,0px)}
.top-in{display:flex;align-items:center;gap:24px;min-height:74px}
.brand{display:flex;align-items:center;gap:13px;text-decoration:none;margin-right:auto;min-width:0}
.brand svg{flex:none;filter:drop-shadow(0 4px 10px rgba(41,74,53,.18))}
.wm{font-family:var(--f-display);font-size:25px;font-weight:600;letter-spacing:.2em;line-height:1;color:var(--deep);white-space:nowrap}
.wm span{color:var(--green);font-weight:500}
.wm-sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px;font-weight:600}
.tabs{position:relative;display:flex;gap:4px;padding:5px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1)}
.tabs button{position:relative;z-index:1;display:flex;align-items:center;gap:9px;border:0;background:transparent;padding:8px 18px 8px 13px;border-radius:12px;min-height:50px;text-align:left;transition:color .3s;white-space:nowrap;color:var(--muted)}
.tabs button svg{width:18px;height:18px;flex:none;color:var(--green);transition:color .3s}
.tabs button b{display:block;font-weight:800;font-size:14.5px;color:var(--ink);transition:color .3s;line-height:1.2}
.tabs button small{display:block;font-size:11px;line-height:1.2;transition:color .3s}
.tabs button:hover:not([aria-selected="true"]){background:var(--hover)}
.tabs button[aria-selected="true"],.tabs button[aria-selected="true"] b{color:var(--bg)}
.tabs button[aria-selected="true"] small{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.tabs button[aria-selected="true"] svg{color:#B9DDA6}
.tabs .pill-ind{position:absolute;z-index:0;top:5px;bottom:5px;border-radius:12px;background:var(--deep);box-shadow:0 8px 20px -8px color-mix(in srgb,var(--deep) 80%,transparent);transition:left .4s var(--ease),width .4s var(--ease)}
.top-act{display:flex;gap:8px}
.iconbtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);transition:background .2s,border-color .2s;color:var(--deep)}
.iconbtn:hover{background:var(--hover);border-color:color-mix(in srgb,var(--green) 35%,var(--line))}
.iconbtn svg{width:19px;height:19px}

/* ---------- admin bar ---------- */
.abar{position:sticky;top:calc(74px + env(safe-area-inset-top,0px));z-index:29;background:var(--deep);color:var(--bg)}
.abar .wrap{display:flex;align-items:center;gap:8px;min-height:52px;flex-wrap:wrap;padding-block:6px}
.abar .who{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;margin-right:auto}
.abar .who i{width:8px;height:8px;border-radius:50%;background:#A6DA8F;box-shadow:0 0 0 4px rgba(166,218,143,.22);animation:pulse 2.4s infinite}
.abar .who small{font-weight:500;opacity:.7}
.abtn{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 13px;border-radius:10px;border:1px solid color-mix(in srgb,var(--bg) 22%,transparent);background:transparent;color:var(--bg);font-size:13px;font-weight:600;transition:background .2s}
.abtn:hover{background:color-mix(in srgb,var(--bg) 12%,transparent)}
.abtn.solid{background:var(--bg);color:var(--deep);border-color:var(--bg)}
.abtn.solid:hover{background:color-mix(in srgb,var(--bg) 88%,var(--green))}
.abtn svg{width:16px;height:16px}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(166,218,143,0)}}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,420px);gap:28px;align-items:center;padding-block:42px 30px}
.hero h1{margin:10px 0 0;font-family:var(--f-display);font-weight:500;font-size:clamp(48px,6.4vw,84px);line-height:.92;letter-spacing:-.01em;color:var(--deep);text-wrap:balance}
.hero h1 em{font-style:italic;color:var(--green);font-size:.52em;letter-spacing:0;margin-left:.25em;vertical-align:.32em}
.hero-meta{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:18px;color:var(--muted);font-size:14px;align-items:center}
.hero-meta span{display:inline-flex;align-items:center;gap:7px}
.hero-meta svg{width:16px;height:16px;color:var(--green)}
.phone{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;color:var(--deep);text-decoration:none;box-shadow:var(--sh-1);transition:border-color .2s}
.phone:hover{border-color:var(--green)}
.now{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 22px;box-shadow:var(--sh-2);overflow:hidden}
.now::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 70%);pointer-events:none}
.now-h{display:flex;align-items:center;gap:8px}
.now-h i{width:8px;height:8px;border-radius:50%;background:var(--now);animation:pulse2 2s infinite}
.now-h i.idle{background:var(--green);animation:none}
@keyframes pulse2{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--now) 50%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.now-t{font-family:var(--f-display);font-size:30px;line-height:1.05;font-weight:600;margin:10px 0 4px;color:var(--ink);text-wrap:balance}
.now-s{color:var(--muted);font-size:13.5px}
.now-bar{height:4px;border-radius:2px;background:var(--line-soft);margin-top:14px;overflow:hidden}
.now-bar b{display:block;height:100%;background:var(--now);border-radius:2px}
.now-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft)}
.now-stats div{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.3}
.now-stats b{display:block;font-family:var(--f-display);font-size:26px;font-weight:600;color:var(--deep);line-height:1.1}

/* ---------- controls ---------- */
.ctl{position:relative;z-index:2;display:flex;flex-direction:column;gap:14px;padding-block:6px 20px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.datenav{display:flex;align-items:center;gap:6px;margin-right:auto;min-width:0}
.rng{margin:0 0 0 12px;font-family:var(--f-display);font-weight:600;font-size:32px;line-height:1;letter-spacing:-.005em;white-space:nowrap}
.rng small{display:block;font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;transition:background .2s,border-color .2s,transform .12s,box-shadow .2s;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--hover);border-color:color-mix(in srgb,var(--green) 35%,var(--line))}
.btn:active{transform:translateY(1px)}
.btn.icon{width:42px;padding:0}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--deep);border-color:var(--deep);color:var(--bg)}
.btn.primary:hover{background:color-mix(in srgb,var(--deep) 86%,var(--green))}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 30%,var(--line))}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.seg{display:inline-flex;padding:4px;background:var(--milk);border:1px solid var(--line-soft);border-radius:13px;gap:2px}
.seg button{border:0;background:transparent;min-height:36px;padding:0 15px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--deep);box-shadow:var(--sh-2)}
.seg button svg{width:16px;height:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-right:auto}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted);transition:all .2s}
.chip:hover{color:var(--ink);border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
.chip[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:var(--bg)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--green))}
select.chip{appearance:none;-webkit-appearance:none;padding-right:32px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.search{position:relative;flex:0 1 280px;min-width:200px}
.search input{width:100%;min-height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px 0 38px;font-size:14px;transition:border-color .2s,box-shadow .2s}
.search input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 16%,transparent)}
.search svg{position:absolute;left:12px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--faint)}
.hallsel{min-height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-weight:600;font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px;background:color-mix(in srgb,var(--c) 30%,var(--surface));border:1.5px solid var(--c)}
.legend .lf i{border-style:dashed;border-color:var(--green);background:var(--ok-bg)}
.legend .lc i{border-color:var(--faint);background:repeating-linear-gradient(135deg,var(--hatch) 0 2px,transparent 2px 4px),var(--milk)}

/* ---------- content ---------- */
.content{padding-bottom:56px;min-height:420px}
.enter{animation:enter .45s var(--ease) both}
@keyframes enter{from{opacity:.35;transform:translateY(8px)}}

/* day tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.tile{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh-1);min-height:260px;overflow:hidden;transition:box-shadow .3s,transform .3s var(--ease),border-color .3s;animation:enter .5s var(--ease) both;animation-delay:calc(var(--i,0) * 35ms)}
.tile:hover{box-shadow:var(--sh-2)}
.tile.today{border-color:color-mix(in srgb,var(--green) 55%,var(--line));box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 14%,transparent),var(--sh-2)}
.tile.past{opacity:.72}
.tile.past:hover{opacity:1}
.th{display:flex;align-items:flex-start;gap:10px;padding:18px 18px 12px;border:0;background:transparent;text-align:left;width:100%;cursor:pointer}
.th .dn{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1;color:var(--ink)}
.th .dd{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:7px}
.badge-today{font-size:10px;letter-spacing:.1em;padding:3px 7px;border-radius:6px;background:var(--deep);color:var(--bg)}
.ring{margin-left:auto;flex:none;position:relative;width:46px;height:46px}
.ring svg{width:46px;height:46px;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--deep)}
.tstate{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 18px 12px;font-size:12px;color:var(--muted);font-weight:600}
.fpill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:999px;background:var(--ok-bg);color:var(--deep);font-weight:700;font-size:12px}
.fpill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
.fpill.busy{background:var(--warn-bg);color:var(--warn)}.fpill.busy::before{background:var(--warn)}
.fpill.off,.fpill.past{background:var(--milk);color:var(--muted)}.fpill.off::before,.fpill.past::before{background:var(--faint)}
/* timeline 10–22 inside each tile */
.tl{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr);margin:0 14px 16px 6px}
.tlh{position:relative}
.tlh span{position:absolute;right:8px;transform:translateY(-50%);font-size:10.5px;font-weight:700;color:var(--faint);line-height:1}
.tlh span:first-child{transform:none}
.tlh span:last-child{transform:translateY(-100%)}
.tlt{position:relative;border-radius:12px;background:var(--bg);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hh);box-shadow:inset 0 0 0 1px var(--line-soft);overflow:hidden}
.tlt.adm{cursor:cell}
.blk{position:absolute;left:4px;right:4px;border:0;border-radius:9px;text-align:left;padding:4px 8px;display:flex;flex-direction:column;justify-content:flex-start;gap:0;overflow:hidden;line-height:1.22;transition:transform .2s var(--ease),box-shadow .2s,filter .2s;z-index:1}
.blk .bt{font-size:10.5px;font-weight:700;opacity:.85;white-space:nowrap}
.blk .bn{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .bg{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.sm{justify-content:center}
.blk.xs{flex-direction:row;align-items:center;gap:6px;padding-block:0}
.blk.xs .bt{order:0}
.ev2{background:color-mix(in srgb,var(--c) 17%,var(--surface));color:var(--ink);box-shadow:inset 3px 0 0 var(--c)}
.ev2 .bt{color:color-mix(in srgb,var(--c) 72%,var(--ink))}
.ev2:hover{transform:translateY(-1px);box-shadow:inset 3px 0 0 var(--c),0 8px 18px -10px color-mix(in srgb,var(--c) 80%,transparent);z-index:3}
.ev2.sel{outline:2px solid var(--c);outline-offset:1px}
.ev2.live{box-shadow:inset 3px 0 0 var(--now),0 0 0 2px color-mix(in srgb,var(--now) 50%,transparent)}
.ev2.masked{background:repeating-linear-gradient(135deg,var(--hatch) 0 5px,transparent 5px 10px),var(--milk);box-shadow:inset 3px 0 0 var(--faint)}
.ev2.masked .bt,.ev2.masked .bn{color:var(--muted)}
.ev2.cancel{background:var(--milk);box-shadow:inset 3px 0 0 var(--line)}
.ev2.cancel .bn{text-decoration:line-through;color:var(--faint)}
.ev2.dim{opacity:.28}
.ev2.hit{box-shadow:inset 3px 0 0 var(--c),0 0 0 2px var(--c)}
.blk.free{background:transparent;border:1.5px dashed color-mix(in srgb,var(--green) 60%,transparent);color:var(--deep);left:4px;right:4px}
.blk.free .bn{color:var(--green);font-weight:800;font-size:12px;letter-spacing:.02em}
.blk.free .bt{color:var(--muted);font-weight:600}
.blk.free:hover,.blk.free.hl{background:var(--ok-bg);border-style:solid}
.blk.free.hl{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{background:color-mix(in srgb,var(--green) 22%,var(--surface))}}
.blk.cl{left:0;right:0;border-radius:0;background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px),var(--milk);color:var(--muted)}
.blk.cl .bn{font-size:12px;color:var(--ink)}
.pastov{position:absolute;left:0;right:0;top:0;background:color-mix(in srgb,var(--bg) 55%,transparent);pointer-events:none;z-index:2;border-bottom:1px dashed var(--line)}
.tlt .nowline{z-index:4}
.tlt .nowline b{position:absolute;right:4px;top:-9px;font-size:10px;background:var(--now);color:#fff;border-radius:6px;padding:1px 5px}
.tile.past .tlt{opacity:.55}
.sum{background:var(--deep);color:var(--bg);border-color:var(--deep)}
.sum .sh{padding:20px 20px 0}
.sum .sh .eyebrow{color:color-mix(in srgb,var(--bg) 65%,transparent)}
.sum h3{margin:8px 0 0;font-family:var(--f-display);font-size:30px;font-weight:500;line-height:1}
.sum .kp{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;padding:18px 20px}
.sum .kp div{font-size:11.5px;font-weight:600;color:color-mix(in srgb,var(--bg) 70%,transparent)}
.sum .kp b{display:block;font-family:var(--f-display);font-size:30px;font-weight:600;color:var(--bg);line-height:1.05}
.sum .split{display:flex;height:8px;gap:2px;margin:0 20px;border-radius:4px;overflow:hidden;background:color-mix(in srgb,var(--bg) 14%,transparent)}
.sum .split i{background:var(--c)}
.sum .sl{display:flex;flex-direction:column;gap:6px;padding:14px 20px 20px;font-size:12.5px}
.sum .sl span{display:flex;align-items:center;gap:8px}
.sum .sl i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.sum .sl em{margin-left:auto;font-style:normal;font-weight:700}

/* day view */
.dayview{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:16px}
.dayview .tile{min-height:420px}

/* timeline grid */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh-1);overflow:hidden}
.gscroll{overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:62px repeat(var(--n),minmax(var(--cmin,0px),1fr))}
.gh{position:sticky;top:0;z-index:3;background:var(--surface);border:0;border-bottom:1px solid var(--line);border-left:1px solid var(--line-soft);padding:14px 12px 12px;display:flex;flex-direction:column;gap:2px;text-align:left;transition:background .15s}
.gh:hover{background:var(--milk)}
.gh .d1{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.gh .d2{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.05}
.gh.today .d2{color:var(--green)}
.gh .ld{height:3px;border-radius:2px;background:var(--line-soft);overflow:hidden;margin-top:8px}
.gh .ld i{display:block;height:100%;background:var(--green)}
.corner{position:sticky;top:0;left:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.times{position:sticky;left:0;z-index:2;background:var(--surface)}
.times div{position:absolute;right:10px;transform:translateY(-50%);font-size:11px;font-weight:600;color:var(--faint)}
.times div:first-child{transform:none}
.col{position:relative;border-left:1px solid var(--line-soft);background-image:linear-gradient(var(--line-soft) 1px,transparent 1px);background-size:100% var(--hh)}
.col.today{background-color:color-mix(in srgb,var(--green) 4%,transparent)}
.col.adm{cursor:cell}
.col .off{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px);pointer-events:none}
.slotghost{position:absolute;left:5px;right:5px;border-radius:11px;border:1.5px dashed color-mix(in srgb,var(--green) 70%,transparent);background:color-mix(in srgb,var(--green) 8%,transparent);pointer-events:none;font-size:12px;font-weight:700;color:var(--deep);padding:5px 9px;opacity:0;transition:opacity .12s}
.col:hover .slotghost.on{opacity:1}
.nowline{position:absolute;left:-1px;right:0;height:2px;background:var(--now);z-index:2;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--now)}
.ev{position:absolute;left:5px;right:5px;z-index:1;border-radius:11px;border:1px solid color-mix(in srgb,var(--c) 34%,transparent);background:color-mix(in srgb,var(--c) 14%,var(--surface));padding:6px 9px;text-align:left;overflow:hidden;display:flex;flex-direction:column;gap:1px;transition:box-shadow .2s,transform .2s var(--ease),opacity .2s;line-height:1.25;touch-action:manipulation}
.ev:hover{box-shadow:0 10px 22px -12px color-mix(in srgb,var(--c) 80%,transparent);transform:translateY(-1px);z-index:2}
.ev.sel{outline:2px solid var(--c);outline-offset:1px;z-index:2}
.ev .t{font-weight:700;font-size:12.5px;color:var(--ink)}
.ev .g{font-size:11.5px;color:var(--muted);font-weight:600}
.ev .m{font-size:11px;color:color-mix(in srgb,var(--c) 70%,var(--ink));font-weight:700}
.ev.short{flex-direction:row;align-items:center;gap:7px;padding-block:2px}
.ev.short .g{display:none}
.ev.dim{opacity:.28}
.ev.masked{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px),var(--milk);border-color:var(--line)}
.ev.masked .t,.ev.masked .m{color:var(--muted)}
.ev.cancel{opacity:.55;background:var(--milk);border-style:dashed}
.ev.cancel .t{text-decoration:line-through}
.ev.dragging{opacity:.35}
.ev.drag-preview{opacity:.94;box-shadow:var(--sh-3);pointer-events:none;z-index:60}
.ev.drag-preview.bad{outline:2px solid var(--danger)}
.cl{position:absolute;left:0;right:0;z-index:1;border:0;padding:8px 10px;text-align:left;background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px),color-mix(in srgb,var(--milk) 80%,transparent);font-size:11.5px;font-weight:700;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.free{position:absolute;left:5px;right:5px;border-radius:11px;border:1.5px dashed color-mix(in srgb,var(--green) 55%,transparent);background:var(--ok-bg);color:var(--deep);font-size:12px;font-weight:700;padding:6px 9px;text-align:left;display:flex;flex-direction:column;gap:2px}
.free span{font-weight:500;color:var(--muted);font-size:11px}

/* month */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mh{padding:14px 14px 10px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.mc{position:relative;min-height:124px;border:0;border-bottom:1px solid var(--line-soft);border-left:1px solid var(--line-soft);background:color-mix(in srgb,var(--green) calc(var(--p,0) * .16%),var(--surface));padding:10px 11px;text-align:left;display:flex;flex-direction:column;gap:5px;transition:background .2s;min-width:0}
.mc:nth-child(7n+1){border-left:0}
.mc:hover{background:var(--hover)}
.mc.out{opacity:.45}
.mc.closed-d{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px),var(--milk)}
.mc .n{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.mc .n span{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1}
.mc .n small{font-size:10.5px;font-weight:700;color:var(--muted)}
.mc.today .n span{color:var(--bg);background:var(--deep);border-radius:8px;padding:2px 7px 0}
.mi{display:flex;align-items:center;gap:6px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.mi i{flex:none;width:6px;height:6px;border-radius:50%;background:var(--c)}
.mi b{font-weight:700;color:var(--muted)}
.mi.cl-m{color:var(--muted);font-weight:700}
.more{font-size:11px;color:var(--muted);font-weight:700}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}

/* ---------- footer ---------- */
footer{background:var(--deep);color:var(--bg);margin-top:20px}
footer .wrap{display:grid;grid-template-columns:auto 1fr auto;gap:36px;align-items:center;padding-block:40px calc(40px + env(safe-area-inset-bottom,0px))}
footer .fwm{font-family:var(--f-display);font-size:30px;letter-spacing:.18em;font-weight:600;line-height:1}
footer .fwm small{display:block;font-family:var(--f-ui);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;opacity:.6;margin-top:8px}
footer .addrs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;font-size:13px;color:color-mix(in srgb,var(--bg) 72%,transparent)}
footer .addrs b{display:block;color:var(--bg);font-family:var(--f-display);font-size:20px;font-weight:600;margin-bottom:2px}
footer .ph{font-family:var(--f-display);font-size:26px;font-weight:600;text-decoration:none;white-space:nowrap}
footer .ph small{display:block;font-family:var(--f-ui);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;opacity:.6}

/* ---------- modal ---------- */
.layer{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px}
.scrim{position:absolute;inset:0;background:var(--scrim);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.modal{position:relative;width:min(580px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border-radius:22px;box-shadow:var(--sh-3);animation:pop .32s var(--ease);border:1px solid var(--line)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
.mhd{display:flex;align-items:flex-start;gap:12px;padding:24px 26px 8px}
.mhd h2{margin:0;font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1.05;margin-right:auto;text-wrap:balance}
.mhd p{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.mbd{padding:14px 26px 26px;display:flex;flex-direction:column;gap:16px}
.f{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);min-width:0}
.f input,.f select,.f textarea{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 13px;font-size:15px;font-weight:500;color:var(--ink);width:100%;letter-spacing:0;transition:border-color .2s,box-shadow .2s}
.f textarea{padding:11px 13px;min-height:80px;resize:vertical;line-height:1.45}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 16%,transparent)}
.f small{font-weight:500;color:var(--faint);font-size:12px;letter-spacing:0}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.picks label{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;transition:all .2s;letter-spacing:0}
.picks input{position:absolute;opacity:0;pointer-events:none}
.picks i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--green))}
.picks label:has(input:checked){border-color:var(--c,var(--deep));background:color-mix(in srgb,var(--c,var(--green)) 14%,var(--surface))}
.picks label:has(input:focus-visible){outline:2px solid var(--green);outline-offset:2px}
.wdp{display:flex;gap:6px;flex-wrap:wrap}
.wdp button{width:46px;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:13px}
.wdp button[aria-pressed="true"]{background:var(--deep);color:var(--bg);border-color:var(--deep)}
.msg{border-radius:12px;padding:12px 14px;font-size:13.5px;font-weight:500;line-height:1.5}
.msg b{white-space:nowrap}
a.btn{text-decoration:none}
.msg.err{background:var(--danger-bg);color:var(--danger)}
.msg.warn{background:var(--warn-bg);color:var(--warn)}
.msg.ok{background:var(--ok-bg);color:var(--deep)}
.msg.info{background:var(--milk);color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:4px}
.acts .sp{margin-right:auto}
.confirm{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:14px;background:var(--milk)}
.confirm p{margin:0;font-weight:700;font-size:14px}
.infol{display:flex;gap:9px;align-items:center;font-size:13px;color:var(--muted);background:var(--milk);border-radius:12px;padding:10px 13px}
.infol svg{width:17px;height:17px;flex:none;color:var(--green)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;text-align:right}
.switch{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--ink);letter-spacing:0;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background .2s;margin:0;flex:none;cursor:pointer}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.switch input:checked{background:var(--green)}
.switch input:checked::after{transform:translateX(18px)}

/* ---------- drawer ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:45;width:min(480px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--sh-3);display:flex;flex-direction:column;animation:slide .35s var(--ease);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes slide{from{transform:translateX(36px);opacity:0}}
.dhd{display:grid;grid-template-columns:minmax(0,1fr) 44px;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dhd .seg{justify-self:start;max-width:100%;overflow-x:auto}
.dhd .seg button{padding:0 11px;font-size:13px}
.dbd{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.dbd h3{margin:6px 0 0;font-family:var(--f-display);font-size:22px;font-weight:600}
.item{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.item .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item .hd b{font-size:14px;font-weight:700}
.item p{margin:0;font-size:12.5px;color:var(--muted)}
.ch{font-size:12.5px;color:var(--muted)}
.ch b{color:var(--ink);font-weight:600}
.setrow{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line-soft);border-radius:14px;background:var(--bg)}
.setrow input{min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;width:100%}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:26px;height:26px;border-radius:8px;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);background:var(--c);padding:0}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpis div{padding:14px;border-radius:14px;background:var(--milk);font-size:12px;font-weight:600;color:var(--muted)}
.kpis b{display:block;font-family:var(--f-display);font-size:30px;font-weight:600;color:var(--deep);line-height:1.1}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:var(--line-soft)}
.bar i{background:var(--c)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:300px}
.heat i{aspect-ratio:1;border-radius:6px;background:color-mix(in srgb,var(--green) calc(var(--p) * 1%),var(--line-soft))}
.heat i.o{opacity:.25}
.heat i.x{background:repeating-linear-gradient(135deg,var(--hatch) 0 3px,transparent 3px 6px),var(--milk)}
.bl{display:flex;flex-direction:column;gap:8px}
.bl div{display:grid;grid-template-columns:100px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.bl u{text-decoration:none;height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden}
.bl u i{display:block;height:100%;background:var(--green)}
.bl b{text-align:right}
.empty{text-align:center;padding:36px 12px;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:22px;font-weight:600;margin-bottom:4px}
.note{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0}

/* ---------- toast & busy ---------- */
.toasts{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(500px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--ink);color:var(--bg);border-radius:14px;padding:13px 18px;font-size:14px;font-weight:600;box-shadow:var(--sh-3);animation:pop .3s var(--ease);max-width:100%}
.toast.err{background:var(--danger);color:#fff}
.busy{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 50%,transparent);backdrop-filter:blur(2px)}
.busy div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 22px;display:flex;gap:12px;align-items:center;font-weight:700;box-shadow:var(--sh-3)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--green);animation:rot .8s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.skel{height:300px;border-radius:20px;background:linear-gradient(90deg,var(--milk),var(--surface),var(--milk));background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}


/* hero logo & accents */
.hero-l{display:flex;align-items:center;gap:26px;min-width:0}
.hero-logo{flex:none;width:104px;height:104px;border-radius:50%;box-shadow:0 18px 40px -16px rgba(41,74,53,.45),0 0 0 8px color-mix(in srgb,var(--surface) 70%,transparent);animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px) rotate(-2deg)}}
.hero-txt{min-width:0}
.here{display:inline-flex;align-items:center;gap:6px;color:var(--deep);background:var(--ok-bg);padding:3px 9px;border-radius:999px}
.here::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}
.hero h1{margin-top:12px}
.fbrand{display:flex;align-items:center;gap:16px}
.fbrand svg{flex:none;border-radius:50%;box-shadow:0 0 0 4px color-mix(in srgb,var(--bg) 15%,transparent)}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;width:58px;height:58px;border-radius:18px;border:0;background:var(--deep);color:var(--bg);display:none;place-items:center;box-shadow:0 14px 30px -10px color-mix(in srgb,var(--deep) 85%,transparent)}
.fab svg{width:26px;height:26px}
.hscroll{scrollbar-width:none}.hscroll::-webkit-scrollbar{display:none}
.dstrip{display:none}
.lmark{display:grid;place-items:center;margin:-6px 0 2px}
.lmark svg{border-radius:50%;box-shadow:0 12px 30px -12px rgba(41,74,53,.5)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.5}
.steps b{color:var(--deep)}
/* ---------- responsive ---------- */
@media (max-width:1180px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{grid-template-columns:1fr}footer .wrap{grid-template-columns:1fr}}
@media (max-width:980px){.top-in{flex-wrap:wrap;gap:10px 14px;padding-block:12px}.tabs{order:3;width:100%}.tabs button{flex:1;justify-content:center}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.abar{top:0;position:relative}.top{position:relative}}
@media (max-width:640px){
  body{font-size:15px}
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top-in{min-height:0}
  .wm{font-size:19px;letter-spacing:.16em}.wm-sub{display:none}.brand svg{width:40px;height:40px}
  .tabs{padding:4px;border-radius:14px}
  .tabs button{flex-direction:column;gap:2px;padding:8px 4px;min-height:58px;text-align:center}
  .tabs button svg{width:16px;height:16px}
  .tabs button b{font-size:14px}.tabs button small{font-size:10px}
  .iconbtn{width:42px;height:42px}
  .hero{padding-block:22px 14px;gap:16px}
  .hero-l{gap:14px;align-items:flex-start}.hero-logo{width:64px;height:64px;margin-top:4px}.hero-logo svg{width:64px;height:64px}
  .hero .eyebrow .city{display:none}

        changes.unshift({kind:"series",id:sr.id,after:s0});cands=[{hall:x.hall,date:x.date,s:x.s,e:x.e,single:true}];ignore=function(o){return o.key===occ.key;};label="Изменено занятие «"+x.title+"» "+fmtD(occ.orig)+" (только это)";}

      else{var n=Object.assign({id:uid(),wd:wdOf(x.date),from:x.date<occ.orig?x.date:occ.orig,until:sr.until,ex:{}},base);

        changes=[{kind:"series",id:sr.id,after:s0.until<s0.from?null:s0},{kind:"series",id:n.id,after:n}];cands=seriesDates(n);ignore=function(o){return o.id===sr.id&&o.orig>=occ.orig;};label="Изменена серия «"+x.title+"» начиная с "+fmtD(occ.orig);notes.push({id:n.id,text:x.note});}

function doCopy(occ,date,msg){

  var ev={id:uid(),hall:occ.hall,date:date,s:occ.s,e:occ.e,cat:occ.cat,title:occ.title};
  commit("Скопирована запись «"+occ.title+"» на "+fmtD(date),[{kind:"event",id:ev.id,after:ev}],{toast:"Копия создана на "+fmtD(date)});
}
function moveOcc(occ,date,hid,s){

  if(occ.type==="event"){var ev=clone(S.events.filter(function(x){return x.id===occ.id;})[0]);Object.assign(ev,{date:date,s:s,e:e,hall:hid});return commit(label,[{kind:"event",id:ev.id,after:ev}],{toast:"Запись перенесена"});}
  var sr=clone(S.series.filter(function(x){return x.id===occ.id;})[0]);sr.ex=sr.ex||{};
  if(hid!==sr.hall){sr.ex[occ.orig]=null;var ev2={id:uid(),hall:hid,date:date,s:s,e:e,cat:occ.cat,title:occ.title};return commit(label,[{kind:"series",id:sr.id,after:sr},{kind:"event",id:ev2.id,after:ev2}],{toast:"Занятие перенесено"});}
  sr.ex[occ.orig]={date:date,s:s,e:e,cat:occ.cat,title:occ.title};
  commit(label+" (только это)",[{kind:"series",id:sr.id,after:sr}],{toast:"Занятие перенесено, остальные в серии без изменений"});
}

function stats(bid,from,to){
  var b=S.branches.filter(function(x){return x.id===bid;})[0],booked=0,cap=0,byCat={},byDay={},closed={};
  b.halls.forEach(function(h){for(var d=from;d<=to;d=addDays(d,1)){var L=dayLoad(h.id,d);cap+=L.cap;byDay[d]=(byDay[d]||0)+L.booked;booked+=L.booked;if(L.cap===0)closed[d]=true;}
    occurrences(h.id,from,to).forEach(function(o){if(!o.cancel)byCat[o.cat]=(byCat[o.cat]||0)+clipM(o.s,o.e);});});
  return {booked:booked,cap:cap,pct:cap?Math.round(booked/cap*100):0,byCat:byCat,byDay:byDay,closed:closed,halls:b.halls.length};
}

function offHTML(){
  var list=S.closures.slice().sort(function(a,b){return a.from<b.from?1:-1;});
  return '<button class="btn primary" data-dact="newoff">'+ICON.plus+'Отметить нерабочее время</button>'+
   (list.length?list.map(function(c){var b=S.branches.filter(function(x){return x.id===c.branch;})[0]||{name:"—"};var past=c.to<today();
    return '<div class="item"'+(past?' style="opacity:.6"':'')+'><div class="hd"><b>'+esc(c.reason)+'</b><span class="note tnum">'+(c.from===c.to?fmtD(c.from):fmtD(c.from)+" — "+fmtD(c.to))+'</span></div><p>'+esc(b.name)+(c.hall?", "+esc(hallName(c.hall)):", все залы")+' · '+(c.s==null||c.s===""?"весь день":fmtT(+c.s)+"–"+fmtT(+c.e))+'</p><div class="row"><button class="btn sm" data-dact="editoff" data-id="'+c.id+'">Изменить</button></div></div>';}).join(""):'<div class="empty"><b>Всё работает</b>Отметьте праздники, ремонт или мероприятия — занятия в эти дни будут показаны как «не проводится».</div>');
}
function histHTML(){
  if(UI.hist===null)return '<div class="empty"><span class="spin"></span></div>';
  if(!UI.hist.length)return '<div class="empty"><b>Изменений пока нет</b>Каждое создание, правка и удаление записи появится здесь с датой и временем. Любое изменение можно откатить.</div>';
  return UI.hist.map(function(h){return '<div class="item"><div class="hd"><b style="font-weight:600">'+esc(h.label)+'</b></div><p class="tnum">'+new Date(h.ts).toLocaleString("ru-RU",{day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"})+'</p>'+
    (h.changes||[]).slice(0,4).map(function(c){var t=(c.after||c.before||{});var nm=c.kind==="closure"?(t.reason||"Нерабочее время"):splitTitle(t.title||"").t;return '<div class="ch">'+(c.before&&c.after?"Изменено":c.after?"Создано":"Удалено")+' <b>'+esc(nm)+'</b></div>';}).join("")+
    ((h.changes||[]).length?'<div class="row"><button class="btn sm" data-dact="restore" data-id="'+h.id+'">Вернуть как было до изменения</button></div>':'')+'</div>';}).join("");
}
function setHTML(){
  return '<h3 style="margin-top:0">Категории</h3><p class="note">Новое название и цвет сразу применяются ко всем записям категории.</p>'+
  S.categories.map(function(c){return '<div class="setrow" data-cat="'+c.id+'"><input value="'+esc(c.name)+'" data-cn aria-label="Название"'+(c.kind==="kiwi"?" disabled":"")+' maxlength="40"><div class="sw">'+PALETTE.map(function(p){return '<button type="button" style="--c:'+p+'" data-col="'+p+'" aria-label="Цвет" aria-pressed="'+(p.toLowerCase()===c.color.toLowerCase())+'"></button>';}).join("")+'</div></div>';}).join("")+
  '<h3>Залы</h3>'+S.branches.map(function(b){return '<div class="setrow"><b style="font-size:13px">'+esc(b.name)+'</b>'+b.halls.map(function(h){return '<input value="'+esc(h.name)+'" data-hn="'+h.id+'" aria-label="Название зала">';}).join("")+'<button class="btn sm ghost" data-dact="addhall" data-id="'+b.id+'" style="align-self:flex-start">'+ICON.plus+'Добавить зал</button></div>';}).join("")+
  '<h3>Контакты и сезон</h3><label class="f">Телефон на сайте<input id="s-phone" value="'+esc(S.settings.phone)+'"></label>'+
  '<label class="f">Конец сезона (для новых повторов)<input type="date" id="s-season" value="'+esc(S.settings.seasonEnd)+'"></label>'+
  '<div class="msg" id="s-msg" hidden></div><div class="acts"><span class="sp"></span><button class="btn primary" data-dact="saveset">Сохранить настройки</button></div>';
}
function onDrawerClick(e){
  var tb=e.target.closest("[data-tab]");if(tb){UI.tab=tb.dataset.tab;renderDrawer();if(UI.tab==="hist")loadHist(true);return;}
  var col=e.target.closest("[data-col]");if(col){var row=col.closest("[data-cat]");$$("[data-col]",row).forEach(function(x){x.setAttribute("aria-pressed",x===col);});return;}
  var a=e.target.closest("[data-dact]");if(!a)return;var id=a.dataset.id,act=a.dataset.dact;
  if(act==="close")return closeDrawer();
  if(act==="newoff")return openClosure({});
  if(act==="editoff")return openClosure({id:id});
  if(act==="restore"){var h=UI.hist.filter(function(x){return x.id===id;})[0];if(!h)return;
    var changes=h.changes.map(function(c){return {kind:c.kind,id:c.id,after:c.before?clone(c.before):null};});
    var ids={};h.changes.forEach(function(c){ids[c.id]=1;});var cands=[];
    changes.forEach(function(c){if(!c.after||c.kind==="closure")return;cands=cands.concat(c.kind==="event"?[{hall:c.after.hall,date:c.after.date,s:c.after.s,e:c.after.e,single:true}]:seriesDates(c.after));});
    var cf=conflicts(cands,function(o){return ids[o.id];},false);if(cf.length){toast("Вернуть нельзя: "+conflictText(cf),"error");return;}
    commit("Возврат: "+h.label,changes,{toast:"Изменение отменено"});return;}
  if(act==="addhall"){var b=S.branches.filter(function(x){return x.id===id;})[0];var inp=document.createElement("input");inp.value="Зал "+(b.halls.length+1+$$('[data-hn^="new:'+id+':"]',drawerEl).length);inp.dataset.hn="new:"+id+":"+uid();a.before(inp);inp.focus();return;}
  if(act==="saveset"){
    var msg=$("#s-msg",drawerEl),cats=clone(S.categories),brs=clone(S.branches),names={};
    var rows=$$("[data-cat]",drawerEl);for(var i=0;i<rows.length;i++){var r=rows[i],c=cats.filter(function(x){return x.id===r.dataset.cat;})[0];if(!c)continue;var nm=$("[data-cn]",r).value.trim(),sel=$("[data-col][aria-pressed=true]",r);
      if(!nm)return showMsg(msg,"err","У каждой категории должно быть название.");if(names[nm.toLowerCase()])return showMsg(msg,"err","Название «"+nm+"» повторяется. Сделайте названия разными.");names[nm.toLowerCase()]=1;
      if(c.kind!=="kiwi")c.name=nm;if(sel)c.color=sel.dataset.col;}
    var hn=$$("[data-hn]",drawerEl);for(var j=0;j<hn.length;j++){var v=hn[j].value.trim();if(!v)return showMsg(msg,"err","Укажите название зала.");var k=hn[j].dataset.hn;
      if(k.indexOf("new:")===0){var p=k.split(":");brs.filter(function(x){return x.id===p[1];})[0].halls.push({id:p[1]+"-"+uid(),name:v});}
      else brs.forEach(function(bb){bb.halls.forEach(function(hh){if(hh.id===k)hh.name=v;});});}
    var ph=$("#s-phone",drawerEl).value.trim();if(ph.replace(/\D/g,"").length<10)return showMsg(msg,"err","Проверьте телефон: нужно не меньше 10 цифр.");
    var set=clone(S.settings);set.phone=ph;var se=$("#s-season",drawerEl).value;if(se)set.seasonEnd=se;
    commit("Изменены настройки: категории, залы, контакты",[],{meta:{categories:cats,branches:brs,settings:set},toast:"Настройки сохранены"});return;}
}

/* ================= export ================= */
function exportCSV(){
  var b=branch(),ms=monthStart(UI.date),me=monthEnd(UI.date);
  var q=function(v){return '"'+String(v).replace(/"/g,'""')+'"';};
  var rows=[["Филиал","Зал","Дата","День недели","Начало","Окончание","Часы","Категория","Занятие","Статус"]];
  b.halls.forEach(function(h){occurrences(h.id,ms,me).forEach(function(o){rows.push([b.name,h.name,o.date.split("-").reverse().join("."),WL[wdOf(o.date)],fmtT(o.s),fmtT(o.e),String((o.e-o.s)/60).replace(".",","),cat(o.cat).name,o.title,o.cancel?"Не проводится: "+o.reason:"Проводится"]);});});
  var data="﻿"+rows.map(function(r){return r.map(q).join(";");}).join("\r\n");
  var name="KIWI_"+b.slug+"_"+ms.slice(0,7)+".csv";
  try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/csv;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);toast("Файл "+name+" скачан");}
  catch(e){toast("Браузер не дал скачать файл. Попробуйте другой браузер.","error");}
}

/* ================= events ================= */
function go(delta){if(UI.view==="month"){var d=parseISO(monthStart(UI.date));d.setMonth(d.getMonth()+delta);UI.date=toISO(d);}else UI.date=addDays(UI.date,UI.view==="day"?delta:delta*7);render();if(UI.drawer&&UI.tab==="stats")renderDrawer();}
function slotAt(col,y){var r=col.getBoundingClientRect(),lo=+col.dataset.lo,m=lo+Math.floor((y-r.top)/HH*2)*30;return m<DAY_S||m>=DAY_E?null:m;}
document.addEventListener("click",function(e){
  if(drag.moved){drag.moved=false;return;}
  var t=e.target;if(!t.closest)return;
  if(t.closest(".layer,.drawer"))return;
  var br=t.closest("[data-branch]");if(br){UI.branch=br.dataset.branch;UI.hall=null;ls.set("kiwi-branch",UI.branch);try{history.replaceState(null,"","#"+branch().slug);}catch(x){}render();return;}
  var vw=t.closest("[data-view]");if(vw){UI.view=vw.dataset.view;ls.set("kiwi-view",UI.view);render();return;}
  var ly=t.closest("[data-layout]");if(ly){UI.layout=ly.dataset.layout;ls.set("kiwi-layout",UI.layout);render();return;}
  var fl=t.closest("[data-filter]");if(fl){UI.filter=fl.dataset.filter;UI.tenant="";render();return;}
  var cl=t.closest("[data-closure]");if(cl){openClosureView(cl.dataset.closure);return;}
  var ev=t.closest("[data-key]");if(ev){var o=findOcc(ev.dataset.key);if(!o)return;if(UI.admin)openEntry({mode:"edit",key:o.key});else showOcc(o);return;}
  var fr=t.closest("[data-free]");if(fr){var p=fr.dataset.free.split("-").map(Number);if(UI.admin){var st0=p[0],tk=fr.closest(".tlt");if(tk){var rr=tk.getBoundingClientRect(),HT2=parseFloat(tk.parentNode.style.getPropertyValue("--hh"))||40;st0=Math.min(Math.max(p[0],DAY_S+Math.floor((e.clientY-rr.top)/HT2*2)*30),p[1]-30);}openEntry({mode:"new",date:fr.dataset.date,hall:fr.dataset.hall,s:st0,e:Math.min(p[1],st0+60)});}else openFree(fr.dataset.date,p[0],p[1]);return;}
  var sp=t.closest("[data-strip]");if(sp){var tl=$(".tiles"),tile=tl&&$('[data-tile="'+sp.dataset.strip+'"]',tl);if(tile)tl.scrollTo({left:tile.offsetLeft-16,behavior:"smooth"});$$("#dstrip button").forEach(function(b){b.setAttribute("aria-pressed",b===sp);});return;}
  var ad=t.closest("[data-add]");if(ad){openEntry({mode:"new",date:ad.dataset.add,hall:ad.dataset.hall});return;}
  var gd=t.closest("[data-goday]");if(gd){UI.date=gd.dataset.goday;UI.view="day";render();window.scrollTo({top:Math.max(0,$("#content").getBoundingClientRect().top+window.scrollY-200),behavior:"smooth"});return;}
  var trk=t.closest(".tlt");if(trk&&UI.admin&&trk.classList.contains("adm")&&!t.closest("button")){var tr=trk.getBoundingClientRect(),HT=parseFloat(trk.parentNode.style.getPropertyValue("--hh"))||40,tm=DAY_S+Math.floor((e.clientY-tr.top)/HT*2)*30;if(tm>=DAY_S&&tm<DAY_E)openEntry({mode:"new",date:trk.dataset.date,hall:trk.dataset.hall,s:tm,e:Math.min(tm+60,DAY_E)});return;}
  var col=t.closest(".col");if(col&&UI.admin&&!t.closest("button")){var m=slotAt(col,e.clientY);if(m!=null)openEntry({mode:"new",date:col.dataset.date,hall:col.dataset.hall,s:m,e:Math.min(m+60,DAY_E)});return;}
  var a=t.closest("[data-act]");if(!a)return;
  switch(a.dataset.act){
    case "prev":return go(-1);case "next":return go(1);case "today":UI.date=today();return render();
    case "new":return openEntry({mode:"new",date:UI.date>=today()?UI.date:today()});
    case "closure":return openClosure({date:UI.date>=today()?UI.date:today()});
    case "drawer":return UI.drawer?closeDrawer():openDrawer();
    case "export":return exportCSV();
    case "login":return openLogin();
    case "logout":return logout();
    case "install":return doInstall();
  }
});
document.addEventListener("mousemove",function(e){var col=e.target.closest&&e.target.closest(".col");if(!col||!UI.admin)return;var g=$(".slotghost",col);if(!g)return;
  if(e.target.closest("button")){g.classList.remove("on");return;}var m=slotAt(col,e.clientY);if(m==null){g.classList.remove("on");return;}
  g.style.top=((m-+col.dataset.lo)/60*HH+1)+"px";g.style.height=(HH-3)+"px";g.textContent="+ "+fmtT(m);g.classList.add("on");});
document.addEventListener("change",function(e){if(e.target.id==="tenantsel"){UI.tenant=e.target.value;UI.filter=e.target.value?"tenant":"all";render();}if(e.target.id==="hallsel"){UI.hall=e.target.value;render();}});
var qT=null;document.addEventListener("input",function(e){if(e.target.id==="q"){UI.q=e.target.value.trim();clearTimeout(qT);qT=setTimeout(renderContent,140);}});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){if(modalEl&&!busy)closeModal();else if(drawerEl)closeDrawer();}});
window.addEventListener("hashchange",function(){route();render();});
function route(){var h=(location.hash||"").replace("#","");var b=S.branches.filter(function(x){return x.slug===h;})[0];if(b){UI.branch=b.id;UI.hall=null;}}

/* swipe between days on phones */
var sw=null;
document.addEventListener("touchstart",function(e){if(UI.view!=="day"||modalEl||!e.target.closest||!e.target.closest("#content"))return;var t=e.touches[0];sw={x:t.clientX,y:t.clientY};},{passive:true});
document.addEventListener("touchend",function(e){if(!sw)return;var t=e.changedTouches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y;sw=null;if(Math.abs(dx)>70&&Math.abs(dy)<50)go(dx<0?1:-1);},{passive:true});

/* drag & drop in the time grid (admin, mouse or pen) */
var drag={on:false,moved:false};
document.addEventListener("pointerdown",function(e){if(!UI.admin||busy||e.button!==0||e.pointerType==="touch")return;var ev=e.target.closest&&e.target.closest(".ev");if(!ev||ev.classList.contains("cancel"))return;var r=ev.getBoundingClientRect();drag={on:true,moved:false,el:ev,key:ev.dataset.key,x:e.clientX,y:e.clientY,dy:e.clientY-r.top,w:r.width,h:r.height,pv:null,target:null};});
document.addEventListener("pointermove",function(e){
  if(!drag.on)return;
  if(!drag.pv){if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)<6)return;drag.pv=drag.el.cloneNode(true);drag.pv.classList.add("drag-preview");drag.pv.style.cssText+=";position:fixed;left:0;top:0;right:auto;width:"+drag.w+"px;height:"+drag.h+"px";document.body.appendChild(drag.pv);drag.el.classList.add("dragging");document.body.style.userSelect="none";}
  drag.pv.style.display="none";var under=document.elementFromPoint(e.clientX,e.clientY);drag.pv.style.display="";
  var col=under&&under.closest(".col"),o=findOcc(drag.key);
  if(col&&o){var r=col.getBoundingClientRect(),lo=+col.dataset.lo,s=lo+Math.round((e.clientY-drag.dy-r.top)/HH*4)*15;s=Math.max(DAY_S,Math.min(DAY_E-(o.e-o.s),s));
    drag.target={date:col.dataset.date,hall:col.dataset.hall,s:s};drag.pv.style.transform="translate("+(r.left+5)+"px,"+(r.top+(s-lo)/60*HH+1)+"px)";drag.pv.style.width=(r.width-10)+"px";
    drag.pv.classList.toggle("bad",conflicts([{hall:col.dataset.hall,date:col.dataset.date,s:s,e:s+o.e-o.s,single:true}],function(x){return x.key===o.key;}).length>0);
    var mm=$(".m",drag.pv);if(mm)mm.textContent=fmtT(s)+"–"+fmtT(s+o.e-o.s);}
  else{drag.target=null;drag.pv.style.transform="translate("+(e.clientX-20)+"px,"+(e.clientY-drag.dy)+"px)";}
});
document.addEventListener("pointerup",function(){if(!drag.on)return;drag.on=false;if(drag.pv){drag.pv.remove();drag.el.classList.remove("dragging");document.body.style.userSelect="";drag.moved=true;setTimeout(function(){drag.moved=false;},60);var o=findOcc(drag.key);if(o&&drag.target)moveOcc(o,drag.target.date,drag.target.hall,drag.target.s);}});

/* live updates: check for a new version every 30 s */
function poll(){
  if(document.hidden||busy||modalEl||drag.on)return;
  API.rev().then(function(r){if(r&&r.rev>S.rev)return API.state().then(function(x){var y=window.scrollY;S=norm(x.state);remember();render();window.scrollTo(0,y);});}).catch(function(){});
}
setInterval(poll,45000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)poll();});
setInterval(function(){if(!modalEl&&!drag.on&&S){var y=window.scrollY;var hero=$(".now");if(hero)hero.outerHTML=nowCard();renderContent();window.scrollTo(0,y);}},5*60*1000);

/* ================= boot ================= */
function start(){
  S=norm(S);
  var sb=ls.get("kiwi-branch");if(sb&&S.branches.some(function(b){return b.id===sb;}))UI.branch=sb;
  var sv=ls.get("kiwi-view");if(sv)UI.view=sv;
  var sl=ls.get("kiwi-layout");if(sl)UI.layout=sl;
  route();
  var tk=ss.get("kiwi-token");if(tk){UI.token=tk;UI.admin=true;}
  render();
  if(UI.admin)API.history(tk).catch(function(e){if(e&&e.code==="auth"){endSession();}});
  if(!IS_GAS&&"serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(function(){});
}
function remember(){try{localStorage.setItem("kiwi-last",JSON.stringify(S));}catch(e){}}
if(S)start();else API.state().then(function(r){S=r.state;start();remember();}).catch(function(){
  var last=null;try{last=JSON.parse(localStorage.getItem("kiwi-last")||"null");}catch(e){}
  if(last&&last.branches){S=last;start();toast("Нет связи с сервером — показано последнее сохранённое расписание","error");return;}
  $("#app").innerHTML='<div class="wrap" style="padding-block:80px"><div class="empty"><b>Не удалось загрузить расписание</b>Проверьте подключение к интернету и обновите страницу.</div></div>';});
})();
</script>
